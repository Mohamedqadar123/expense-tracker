name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      # Not committed (gitignored, same as .env) since real deployments use
      # their own secrets — these are fixed dummy test-only credentials for
      # the Dockerized Postgres test database that `pretest` spins up below.
      - name: Create .env.test
        working-directory: server
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL="postgresql://test:test@localhost:5434/expense_tracker_test?schema=public"
          NODE_ENV=test
          JWT_SECRET=test_jwt_secret_do_not_use_in_prod
          CORS_ORIGIN=http://localhost:5173
          ANTHROPIC_API_KEY=test-key-unused
          PORT=3001
          EOF

      - name: Run tests
        working-directory: server
        run: npm test
